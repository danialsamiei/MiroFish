services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: gantor/mirofish-frontend:${MIROFISH_TAG:-latest}
    container_name: qadr-mirofish-frontend
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.00
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - fgpt_ingress

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: gantor/mirofish-backend:${MIROFISH_TAG:-latest}
    container_name: qadr-mirofish-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_DEBUG: "false"
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5001
      ALLOW_DEGRADED_MODE: ${ALLOW_DEGRADED_MODE:-true}
    mem_limit: 2g
    cpus: 2.00
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=10)\" >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - mirofish_uploads:/app/backend/app/uploads
    networks:
      - fgpt_ingress
      - fgpt_ai

volumes:
  mirofish_uploads:

networks:
  fgpt_ingress:
    external: true
    name: fgpt_ingress
  fgpt_ai:
    external: true
    name: fgpt_ai

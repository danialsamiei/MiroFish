<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QEngin</title>
<style>
:root{--bg:#0b1120;--p:#121a2c;--p2:#182238;--b:#263450;--pri:#4f8cff;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--t:#e5ecf6;--m:#9fb0cb;--d:#70819d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:Segoe UI,Tahoma,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}a{color:#8fb7ff;text-decoration:none}pre{white-space:pre-wrap;word-break:break-word}.hidden{display:none!important}.card,.panel,.box{background:var(--p);border:1px solid var(--b);border-radius:18px;box-shadow:0 16px 48px rgba(0,0,0,.22)}.panel,.box{padding:18px}.btn{padding:10px 14px;border-radius:12px;border:1px solid transparent;background:var(--p2);color:var(--t)}.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.warn{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.35);color:#ffd893}.btn.err{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35);color:#ffb4b4}.btn.ghost{background:transparent;border-color:var(--b);color:var(--m)}.btn:disabled{opacity:.55;cursor:not-allowed}.badge{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;font-size:.74rem}.draft{background:rgba(100,116,139,.18);color:#c1cbda}.configured{background:rgba(79,140,255,.16);color:#93bbff}.running{background:rgba(245,158,11,.16);color:#ffd893}.complete{background:rgba(16,185,129,.16);color:#8ef0ca}.failed{background:rgba(239,68,68,.16);color:#ffb4b4}.cancelled{background:rgba(244,114,182,.16);color:#ffbad7}.login{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}.card{width:min(430px,100%);padding:30px}.field{display:grid;gap:8px}.field label{font-size:.82rem;color:var(--d)}.field input,.field textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--b);background:var(--p2);color:var(--t)}.field textarea{min-height:100px;resize:vertical}.shell{display:none;min-height:100vh}.shell.active{display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px 22px;background:#0f172a;border-bottom:1px solid var(--b)}.top h1{margin:0;font-size:1.15rem}.top p{margin:4px 0 0;color:var(--d);font-size:.82rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.main{display:flex;flex:1;min-height:0}.side{width:330px;overflow:auto;padding:18px;background:#0f1728;border-left:1px solid var(--b)}.content{flex:1;overflow:auto;padding:22px}.list{display:grid;gap:10px}.nb{padding:14px;border-radius:16px;border:1px solid var(--b);background:var(--p2);cursor:pointer}.nb.active{border-color:var(--pri)}.nb h4{margin:0 0 8px;font-size:.95rem}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--d);font-size:.75rem}.prog{margin-top:10px;height:8px;border-radius:999px;overflow:hidden;background:#0b1222;border:1px solid #1b2942}.prog>div{height:100%;background:linear-gradient(90deg,#3a79f0,#60a5fa)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.stat{padding:18px;border-radius:18px;border:1px solid var(--b);background:var(--p)}.stat h3,.box h3{margin:0 0 8px;font-size:.82rem;color:var(--d)}.stat .v{font-size:1.75rem;font-weight:700}.small{font-size:.82rem;color:var(--m);line-height:1.9}.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.kv .box{padding:14px}.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{padding:9px 14px;border-radius:999px;border:1px solid var(--b);background:transparent;color:var(--m)}.tab.active{background:rgba(79,140,255,.16);border-color:rgba(79,140,255,.35);color:#fff}.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(79,140,255,.12);color:#8fb7ff;font-size:.74rem;margin:3px 0 0 6px}.json{background:#0d1424;border:1px solid #22314b;border-radius:14px;padding:14px;max-height:420px;overflow:auto}.empty{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--m);line-height:2}.timeline{display:grid;gap:10px}.item{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.02);border:1px solid #22314b}.item .name{font-weight:700}.item .sub{color:var(--m);font-size:.85rem;line-height:1.8}.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.22);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (max-width:1100px){.main{flex-direction:column}.side{width:100%;border-left:none;border-top:1px solid var(--b)}.kv,.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><h1 style="margin:0 0 10px">QEngin</h1><p class="small" style="margin:0 0 18px">Enhanced Network for Generative Intelligence &amp; Navigation</p><div class="field"><label>نام کاربری</label><input id="u" value="admin"></div><div class="field" style="margin-top:12px"><label>رمز عبور</label><input id="p" type="password"></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="login()">ورود</button></div><div id="loginErr" style="margin-top:12px;color:#ffb4b4;min-height:1.4em"></div></div></div>
<div id="shell" class="shell"><div class="top"><div><h1>QEngin</h1><p>Notebook execution, diagnostics, exports, and live monitoring</p></div><div class="actions"><span id="me" class="badge configured"></span><button class="btn ghost" onclick="showHome()">داشبورد</button><button class="btn ghost" onclick="showGuide()">راهنما و خدمات</button><button class="btn ghost" onclick="showStatus()">وضعیت سیستم</button><button class="btn primary" onclick="showHome(true)">+ نت‌بوک جدید</button><button class="btn" onclick="logout()">خروج</button></div></div><div class="main"><aside class="side"><div class="actions" style="justify-content:space-between;margin-bottom:12px"><strong class="small">نت‌بوک‌ها</strong><button class="btn ghost" onclick="loadNotebooks()">بازخوانی</button></div><div id="list" class="list"></div></aside><main id="content" class="content"></main></div></div>
<datalist id="modelOptions"><option value="gpt-4o"><option value="gpt-4.1"><option value="gpt-4o-mini"><option value="openai/gpt-5.2"><option value="freegpt-local"></datalist>
<datalist id="modeOptions"><option value="strategic-brief"><option value="market-impact"><option value="risk-early-warning"><option value="scenario-analysis"><option value="executive-memo"></datalist>
<datalist id="depthOptions"><option value="standard"><option value="deep"><option value="rapid"></datalist>
<script>
const API='/engine',S={token:localStorage.getItem('engine_token'),notebooks:[],current:null,tab:'overview',poll:null,logCursor:0,suggestion:null};
const GUIDE_EXAMPLES=[
{id:'hormuz',title:'تحلیل اثر بسته شدن تنگه هرمز',topic:'اثر بسته شدن تنگه هرمز بر بازار انرژی، بیمه و کشتیرانی',llm_model:'gpt-4o',analysis_mode:'market-impact',analysis_depth:'deep',source_limit:'9',operator_notes:'روی نفت، LNG، بیمه دریایی، ناوگان تجاری و سناریوهای شوک کوتاه‌مدت تمرکز شود.'},
{id:'red-sea',title:'امنیت کشتیرانی دریای سرخ',topic:'چشم‌انداز امنیت کشتیرانی دریای سرخ در سه ماه آینده',llm_model:'gpt-4o-mini',analysis_mode:'risk-early-warning',analysis_depth:'standard',source_limit:'8',operator_notes:'روی حملات، rerouting، هزینه حمل و شاخص‌های هشدار سریع تمرکز شود.'},
{id:'sanctions',title:'اثر تحریم بر زنجیره تامین',topic:'اثر تشدید تحریم‌ها بر زنجیره تامین فناوری و پرداخت بین‌المللی',llm_model:'openai/gpt-5.2',analysis_mode:'executive-memo',analysis_depth:'deep',source_limit:'10',operator_notes:'ریسک زنجیره تامین، پرداخت، بازار موازی و سناریوهای پاسخ سیاستی استخراج شود.'}
];
const el=id=>document.getElementById(id),esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'),arr=v=>Array.isArray(v)?v:[],fmt=v=>{if(!v)return '-';try{return new Date(v).toLocaleString('fa-IR')}catch{return v}},j=v=>JSON.stringify(v??{},null,2),labels={draft:'پیش‌نویس',configured:'آماده اجرا',running:'در حال اجرا',complete:'تکمیل‌شده',failed:'ناموفق',cancelled:'متوقف‌شده'},badge=s=>`<span class="badge ${esc(s||'draft')}">${esc(labels[s]||s||'draft')}</span>`;
function stopPoll(){if(S.poll){clearInterval(S.poll);S.poll=null}}async function api(path,opts={}){const h={...(opts.headers||{})};if(S.token)h.Authorization=`Bearer ${S.token}`;if(opts.body&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(`${API}${path}`,{...opts,headers:h});if(r.status===401){logout();throw new Error('نشست منقضی شد')}return r}
function summary(nb){const x=nb.execution||{};return{status:nb.status||'draft',progress:x.progress??nb.progress??0,stage:x.current_stage||nb.current_stage||'idle',cancel_requested:Boolean(x.cancel_requested??nb.cancel_requested),can_cancel:Boolean(x.can_cancel??nb.can_cancel??nb.status==='running')}}
function renderList(){const list=el('list');if(!S.notebooks.length){list.innerHTML='<div class="empty">هنوز نت‌بوکی ایجاد نشده است.</div>';return}list.innerHTML=S.notebooks.map(nb=>{const s=summary(nb);return `<div class="nb ${S.current?.id===nb.id?'active':''}" onclick="openNb('${nb.id}')"><h4>${esc(nb.title||'Untitled notebook')}</h4><div class="meta">${badge(s.status)}<span>${esc(nb.topic||nb.config?.topic||'')}</span></div><div class="prog"><div style="width:${Math.max(0,Math.min(100,s.progress))}%"></div></div><div class="meta" style="margin-top:8px"><span>مرحله: ${esc(s.stage)}</span><span>${s.progress}%</span>${s.cancel_requested?'<span class="badge cancelled">در انتظار توقف</span>':''}</div></div>`}).join('')}
async function login(){try{const r=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:el('u').value.trim(),password:el('p').value})});const d=await r.json();if(!r.ok){el('loginErr').textContent=d.error||'ورود ناموفق';return}S.token=d.token;localStorage.setItem('engine_token',S.token);el('me').textContent=d.user;await enter()}catch(e){el('loginErr').textContent=e.message}} function logout(){stopPoll();S.token=null;S.current=null;localStorage.removeItem('engine_token');el('shell').classList.remove('active');el('login').classList.remove('hidden')} async function enter(){el('login').classList.add('hidden');el('shell').classList.add('active');await loadNotebooks();showHome()} async function loadNotebooks(){const r=await api('/notebooks');const d=await r.json();S.notebooks=d.notebooks||[];renderList()}
function homeStats(){const n=S.notebooks;const running=n.filter(x=>x.status==='running').length,complete=n.filter(x=>x.status==='complete').length,failed=n.filter(x=>x.status==='failed').length,ready=n.filter(x=>x.results_ready).length;return `<div class="grid"><div class="stat"><h3>کل نت‌بوک‌ها</h3><div class="v">${n.length}</div><div class="small">تمام notebookهای ثبت‌شده</div></div><div class="stat"><h3>در حال اجرا</h3><div class="v" style="color:var(--warn)">${running}</div><div class="small">jobهای فعال با poll زنده</div></div><div class="stat"><h3>تکمیل‌شده</h3><div class="v" style="color:var(--ok)">${complete}</div><div class="small">runهای موفق</div></div><div class="stat"><h3>نیازمند بررسی</h3><div class="v" style="color:var(--err)">${failed}</div><div class="small">runهای fail شده</div></div><div class="stat"><h3>نتیجه آماده</h3><div class="v">${ready}</div><div class="small">HTML / Markdown / JSON آماده</div></div></div>`}
function exampleCards(){return GUIDE_EXAMPLES.map(ex=>`<div class="box"><h3>${esc(ex.title)}</h3><div class="small">${esc(ex.topic)}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="applyExample('${ex.id}')">استفاده از این مثال</button></div></div>`).join('')}
function showGuide(){stopPoll();S.current=null;renderList();el('content').innerHTML=`<div class="panel"><h2 style="margin-top:0">راهنما، شرح خدمات و الزامات عملیاتی QEngin</h2><p class="small">این صفحه برای اپراتور، تحلیل‌گر و مدیر سامانه طراحی شده تا بدون خروج از داشبورد بداند سامانه چه کار می‌کند، چه ورودی‌هایی می‌خواهد، چه خروجی‌هایی می‌دهد، چگونه باید وارد شود و در هر مرحله چه انتظاری از run داشته باشد.</p><div class="grid" style="margin-top:16px"><div class="stat"><h3>کاربری اصلی</h3><div class="v" style="font-size:1.1rem">تحلیل ساخت‌یافته</div><div class="small">از موضوع خام تا گزارش عملیاتی</div></div><div class="stat"><h3>خروجی‌ها</h3><div class="v" style="font-size:1.1rem">HTML / MD / JSON</div><div class="small">برای ارائه، آرشیو و استفاده ماشینی</div></div><div class="stat"><h3>نحوه اجرا</h3><div class="v" style="font-size:1.1rem">Notebook Run</div><div class="small">با status، logs، diagnostics و cancel</div></div><div class="stat"><h3>امنیت نشست</h3><div class="v" style="font-size:1.1rem">Token + Cookie</div><div class="small">توکن امضاشده و نشست محدود زمانی</div></div></div><div class="split" style="margin-top:16px"><div class="box"><h3>شرح خدمات سامانه</h3><ul><li>ساخت notebook تحلیلی از یک موضوع خام یا مسئله عملیاتی</li><li>پیشنهاد پیکربندی اولیه با wizard مبتنی بر LLM</li><li>جمع‌آوری OSINT از GDELT، RSS و SearxNG</li><li>تولید جمع‌بندی اجرایی، یافته‌های کلیدی، سناریوها و اقدامات پیشنهادی</li><li>ثبت مرحله‌به‌مرحله‌ی اجرا برای trace، audit و دیباگ</li><li>خروجی گرفتن برای ارائه مدیریتی، ذخیره‌سازی یا feed دادن به سامانه‌های دیگر</li></ul></div><div class="box"><h3>روش ورود و اطلاعات امنیتی</h3><ul><li>ورود به سامانه با حساب اپراتوری انجام می‌شود و رمز عبور نباید داخل رابط کاربری یا مستند عمومی درج شود.</li><li>حساب عملیاتی فعلی این محیط از نوع مدیریتی است و نشست با token امضاشده و cookie امن نگه داشته می‌شود.</li><li>پس از انقضای نشست، سامانه کاربر را logout می‌کند و ورود مجدد لازم است.</li><li>یادداشت اپراتور محل نگه‌داری secret، password یا کلید خصوصی نیست؛ فقط توضیح تحلیلی وارد شود.</li><li>خروجی‌های HTML/Markdown/JSON باید با طبقه‌بندی مناسب نگه‌داری شوند اگر حاوی تحلیل حساس باشند.</li></ul></div></div><div class="split" style="margin-top:16px"><div class="box"><h3>ورودی‌های مورد انتظار</h3><ul><li><strong>موضوع تحلیل:</strong> الزامی. باید روشن، کوتاه و مسئله‌محور باشد.</li><li><strong>مدل اجرا:</strong> اختیاری. اگر خالی بماند از تنظیمات پیش‌فرض سامانه استفاده می‌شود.</li><li><strong>حالت تحلیل:</strong> نوع خروجی را مشخص می‌کند؛ مثل strategic-brief یا market-impact.</li><li><strong>عمق تحلیل:</strong> سرعت در برابر عمق را تنظیم می‌کند.</li><li><strong>سقف منابع OSINT:</strong> تعداد تقریبی منابعی که برای synthesis وارد می‌شوند.</li><li><strong>یادداشت اپراتور:</strong> جهت‌دهی، محدودسازی دامنه یا تاکید روی ریسک‌ها.</li></ul></div><div class="box"><h3>خروجی‌های مورد انتظار</h3><ul><li><strong>Status:</strong> draft / configured / running / complete / failed / cancelled</li><li><strong>Logs:</strong> مرحله‌ها، زمان، پیام، جزئیات و درصد پیشرفت</li><li><strong>Diagnostics:</strong> pipeline، stage timing، summary منابع و exports</li><li><strong>Results:</strong> executive summary، key findings، recommended actions و در صورت وجود سناریوها</li><li><strong>Exports:</strong> فایل HTML برای ارائه، Markdown برای ویرایش، JSON برای ingest ماشینی</li></ul></div></div><div class="panel" style="margin-top:16px"><h3 style="margin-top:0">جریان عملیاتی پیشنهادی</h3><div class="timeline"><div class="item"><div class="name">1. تعریف مسئله</div><div class="sub">موضوع را به‌جای عبارت کلی، به‌شکل مسئله قابل‌تحلیل بنویس. مثال: «اثر بسته شدن تنگه هرمز بر بازار انرژی و بیمه دریایی».</div></div><div class="item"><div class="name">2. پیشنهاد یا ساخت notebook</div><div class="sub">اگر موضوع خام است ابتدا «پیشنهاد پیکربندی» را بزن؛ اگر از قبل جهت تحلیل را می‌دانی مستقیم notebook بساز.</div></div><div class="item"><div class="name">3. Run Notebook</div><div class="sub">بعد از اجرا، تب Logs را دنبال کن. در مرحله collecting_sources منابع جمع می‌شوند، در synthesis جمع‌بندی ساخته می‌شود و در rendering خروجی‌ها نوشته می‌شوند.</div></div><div class="item"><div class="name">4. بررسی Diagnostics</div><div class="sub">اگر خروجی ضعیف بود یا fail شد، diagnostics را ببین تا بفهمی مشکل از source، مدل یا pipeline بوده است.</div></div><div class="item"><div class="name">5. Export و handoff</div><div class="sub">نسخه HTML را برای ارائه، Markdown را برای ویرایش و JSON را برای سامانه‌های دیگر یا AIهای بعدی استفاده کن.</div></div></div></div><div class="panel" style="margin-top:16px"><h3 style="margin-top:0">مثال‌های عملیاتی آماده</h3><div class="grid">${exampleCards()}</div></div><div class="split" style="margin-top:16px"><div class="box"><h3>چه زمانی stop یا cancel بدهیم؟</h3><ul><li>وقتی موضوع را اشتباه تعریف کرده‌ای</li><li>وقتی می‌بینی model یا mode اشتباه انتخاب شده</li><li>وقتی run طولانی شده و می‌خواهی با source_limit کمتر دوباره اجرا کنی</li><li>وقتی diagnostics نشان می‌دهد خروجی fallback شده و می‌خواهی با مدل دیگر rerun بگیری</li></ul></div><div class="box"><h3>چک‌لیست کیفیت خروجی</h3><ul><li>آیا executive summary با موضوع اولیه هم‌راستاست؟</li><li>آیا key findings به منبع یا منطق عملیاتی متکی‌اند؟</li><li>آیا recommended actions قابل اجرا هستند یا کلی‌گویی دارند؟</li><li>آیا تعداد منابع و زبان‌ها با مسئله تناسب دارند؟</li><li>آیا export مناسب برای مخاطب نهایی انتخاب شده است؟</li></ul></div></div></div>`}
function payload(){const topic=el('topic')?.value?.trim()||'',llm_model=el('model')?.value?.trim()||'',analysis_mode=el('mode')?.value?.trim()||'',analysis_depth=el('depth')?.value?.trim()||'',source_limit=el('sourceLimit')?.value?.trim()||'',operator_notes=el('notes')?.value?.trim()||'';const p={topic};if(llm_model)p.llm_model=llm_model;if(analysis_mode)p.analysis_mode=analysis_mode;if(analysis_depth)p.analysis_depth=analysis_depth;if(source_limit)p.source_limit=source_limit;if(operator_notes)p.operator_notes=operator_notes;return p}

function header(nb){const ex=nb.execution||{},runLabel=nb.status==='running'?'در حال اجرا':(nb.results_ready?'اجرای مجدد':'Run Notebook');return `<div class="box"><div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start"><div><h2 style="margin:0 0 8px">${esc(nb.title||'Untitled notebook')}</h2><div class="small">${esc(nb.config?.topic||'')}</div><div class="actions" style="margin-top:10px">${badge(nb.status)}${ex.cancel_requested?'<span class="badge cancelled">در انتظار توقف</span>':''}<span class="badge configured">مرحله: ${esc(ex.current_stage||'idle')}</span><span class="badge draft">پیشرفت: ${esc(ex.progress??0)}%</span></div></div><div class="actions"><button class="btn primary" ${nb.status==='running'?'disabled':''} onclick="runNb()">${runLabel}</button><button class="btn warn" ${ex.can_cancel?'':'disabled'} onclick="cancelNb()">توقف</button><button class="btn" onclick="refreshNb(true)">بازخوانی</button><button class="btn err" onclick="delNb('${nb.id}')">حذف</button></div></div><div class="grid" style="margin-top:16px"><div class="stat"><h3>مدل</h3><div class="v" style="font-size:1.1rem">${esc(ex.llm_model||nb.config?.llm_model||'-')}</div><div class="small">مدل فعال در run</div></div><div class="stat"><h3>حالت تحلیل</h3><div class="v" style="font-size:1.1rem">${esc(ex.analysis_mode||nb.config?.analysis_mode||'strategic-brief')}</div><div class="small">حالت synthesis</div></div><div class="stat"><h3>منابع</h3><div class="v">${esc(ex.source_count??0)}</div><div class="small">sourceهای جمع‌شده</div></div><div class="stat"><h3>Run ID</h3><div class="v" style="font-size:1rem">${esc(ex.run_id||'-')}</div><div class="small">برای trace و دیباگ</div></div></div><div class="small" style="margin-top:12px">شروع: ${esc(fmt(ex.started_at))} | پایان: ${esc(fmt(ex.completed_at))} | لاگ‌ها: ${esc(ex.logs_count??arr(ex.logs).length)} | ${ex.error?`<span style="color:#ffb4b4">خطا: ${esc(ex.error)}</span>`:'بدون خطای ثبت‌شده'}</div></ function renderNb(){if(!S.current)return;const views={overview:tOverview(S.current),logs:tLogs(S.current),results:tResults(S.current),diagnostics:tDiag(S.current),exports:tExports(S.current)};el('content').innerHTML=`${header(S.current)}<div class="tabs"><button class="tab ${S.tab==='overview'?'active':''}" onclick="setTab('overview')">Overview</button><button class="tab ${S.tab==='logs'?'active':''}" onclick="setTab('logs')">Logs</button><button class="tab ${S.tab==='results'?'active':''}" onclick="setTab('results')">Results</button><button class="tab ${S.tab==='diagnostics'?'active':''}" onclick="setTab('diagnostics')">Diagnostics</button><button class="tab ${S.tab==='exports'?'active':''}" onclick="setTab('exports')">Exports</button></div><div class="panel">${views[S.tab]||''}</div>`} function setTab(t){S.tab=t;renderNb()}
async function runNb(){if(!S.current?.id||S.current.status==='running')return;const r=await api(`/notebooks/${S.current.id}/run`,{method:'POST'}),d=await r.json();if(!r.ok){alert(d.error||'خطا در اجرا');return}S.current.status=d.status||'running';S.current.execution=S.current.execution||{};Object.assign(S.current.execution,{progress:d.progress??0,current_stage:d.current_stage||'queued',error:null,cancel_requested:false});S.current.results_ready=false;S.current.results={};S.current.exports={};S.current.diagnostics=null;S.tab='logs';await loadLogs(true);await loadNotebooks();renderList();renderNb();startPoll()} async function cancelNb(){if(!S.current?.id)return;if(!confirm('درخواست توقف به job ارسال شود؟'))return;const r=await api(`/notebooks/${S.current.id}/cancel`,{method:'POST'}),d=await r.json();if(!r.ok){alert(d.error||'خطا در توقف');return}S.current.execution=S.current.execution||{};S.current.execution.cancel_requested=d.cancel_requested??true;await loadNotebooks();renderList();renderNb()} function startPoll(){stopPoll();if(!S.current?.id)return;S.poll=setInterval(async()=>{try{await refreshNb(false);if(['complete','failed','cancelled'].includes(S.current.status)){stopPoll();S.current=await bundle(S.current.id);await loadLogs(false);if(S.current.results_ready)S.tab='results';else if(S.current.status==='failed')S.tab='diagnostics';await loadNotebooks();renderList();renderNb()}}catch(e){console.error(e);stopPoll()}},2500)} async function delNb(id){if(!confirm('این notebook حذف شود؟'))return;await api(`/notebooks/${id}`,{method:'DELETE'});if(S.current?.id===id){S.current=null;stopPoll()}await loadNotebooks();showHome()}
async function showStatus(){stopPoll();S.current=null;renderList();el('content').innerHTML='<div class="panel"><span class="spin"></span> در حال بررسی وضعیت سیستم...</div>';const r=await api('/system/status'),d=await r.json(),items=[['Graphiti + Neo4j',d.graphiti],['LLM',d.llm],['OSINT',d.osint],['Ensemble',d.ensemble],['AnalystCrew',d.analyst_crew],['Notebook Store',{status:'ok',count:d.notebooks?.count||0}]];el('content').innerHTML=`<div class="panel"><h2 style="margin-top:0">وضعیت سیستم</h2><div class="grid">${items.map(([n,v])=>`<div class="box"><h3>${esc(n)}</h3><div class="v" style="font-size:1.3rem;color:${v?.status==='ok'?'var(--ok)':'var(--err)'}">${esc(v?.status||'unknown')}</div><div class="json" style="margin-top:10px;max-height:260px">${esc(j(v||{}))}</div></div>`).join('')}</div><div class="small" style="margin-top:14px">آخرین بررسی: ${esc(fmt(d.timestamp))}</div></div>`}
(async()=>{if(S.token){try{const r=await api('/auth/me');if(r.ok){const d=await r.json();el('me').textContent=d.user;await enter();return}}catch(e){console.warn(e)}}el('login').classList.remove('hidden')})();
</script>
